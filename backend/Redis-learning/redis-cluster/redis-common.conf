# 端口（每个节点单独修改）
# port 7000

# 开启集群模式
cluster-enabled yes

# 集群节点配置文件（自动生成，每个节点单独命名）
# cluster-config-file nodes-7000.conf

# 节点超时时间（毫秒），超过该时间未响应则认为节点故障
cluster-node-timeout 5000

# 开启AOF持久化
appendonly yes

# AOF文件名
appendfilename "appendonly.aof"

# RDB持久化文件名
dbfilename "dump.rdb"

# 数据存储目录（每个节点单独修改）
# dir ./data/7000

# 后台运行
daemonize yes

# 日志文件
logfile "redis.log"

# 绑定地址
bind 127.0.0.1
